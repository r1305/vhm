<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesos - VHM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>🔐 Accesos por usuario</h2>
        <p>Define qué vistas del panel puede ver cada administrador</p>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-body" style="padding:16px 20px">
        <div class="form-group" style="margin-bottom:0">
          <label for="acc-user-select">Usuario</label>
          <select id="acc-user-select" style="max-width:420px"></select>
          <p id="acc-user-meta" style="font-size:.8rem;color:var(--text-muted);margin-top:8px"></p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>Vistas permitidas</h3>
        <button type="button" class="btn btn-primary btn-sm" id="btn-guardar-accesos">💾 Guardar</button>
      </div>
      <div class="card-body" id="accesos-panel" style="padding:20px"></div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/accesos.js"></script>
</body>
</html>
