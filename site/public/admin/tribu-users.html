<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios Tribu - VHM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>🫂 Usuarios de La Tribu</h2>
        <p>Pacientes importados con acceso a La Tribu</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="filter-row" style="margin-bottom:16px">
          <input type="text" id="inp-busqueda" placeholder="Buscar por nombre, correo o celular…" style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
            <button type="button" id="btn-regenerar-psw" class="btn btn-outline btn-sm" title="Genera contraseñas temporales para usuarios que no tienen una">🔄 Regenerar contraseñas</button>
            <span style="font-size:.85rem;color:var(--text-muted)">Ver por página</span>
            <select id="sel-per-page">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
        <div id="tribu-body"></div>
        <div id="pg-wrap" style="display:none">
          <div id="pg-buttons" style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap"></div>
          <div id="pg-total" style="text-align:center;font-size:.8rem;color:#9ca3af;margin-top:8px"></div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="modal-psw">
      <div class="modal" style="max-width:400px">
        <div class="modal-header">
          <h3>🔑 Contraseña temporal</h3>
          <button type="button" class="modal-close" data-modal-close="modal-psw">✕</button>
        </div>
        <div class="modal-body" style="text-align:center;padding:28px 24px">
          <div id="psw-usuario" style="font-size:.9rem;color:var(--text-muted);margin-bottom:12px"></div>
          <div id="psw-cargando" style="display:none;color:var(--text-muted)">Cargando…</div>
          <div id="psw-valor-wrap" style="display:none">
            <div style="display:flex;align-items:center;justify-content:center;gap:10px">
              <code id="psw-valor" style="font-size:1.4rem;font-weight:700;letter-spacing:3px;color:var(--color-primary);background:var(--bg-input);padding:10px 20px;border-radius:10px;border:1px solid var(--border-strong)"></code>
              <button type="button" id="btn-toggle-psw" style="background:none;border:none;cursor:pointer;font-size:1.3rem" title="Mostrar">👁️</button>
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="btn-copiar-psw" style="margin-top:16px">📋 Copiar</button>
          </div>
          <div id="psw-error" style="display:none;color:var(--color-danger);font-size:.9rem">No se encontró la contraseña temporal.</div>
        </div>
      </div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/tribu-users.js"></script>
</body>
</html>
