<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administradores - VHM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>👥 Administradores del sistema</h2>
        <p>Gestiona quiénes pueden acceder al panel de administración</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nuevo">+ Nuevo usuario</button>
    </div>
    <div class="card">
      <div class="card-body" id="usuarios-body"></div>
    </div>
    <div class="modal-overlay" id="modal-usuario">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-usuario-title">👤 Nuevo Usuario</h3>
          <button type="button" class="modal-close" data-modal-close="modal-usuario">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="f-username">Nombre de usuario</label>
            <input type="text" id="f-username" placeholder="usuario" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="f-nombre">Nombre completo</label>
            <input type="text" id="f-nombre" placeholder="Nombre del usuario" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" placeholder="usuario@correo.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="f-password">Contraseña <span class="optional" id="f-password-hint">(obligatoria para nuevos usuarios)</span></label>
            <input type="password" id="f-password" placeholder="••••••••" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="f-rol">Rol</label>
            <select id="f-rol">
              <option value="ADMIN">Administrador</option>
              <option value="SUPER_ADMIN" id="opt-super-admin" style="display:none">Super Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close="modal-usuario">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar">💾 Guardar</button>
        </div>
      </div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/usuarios.js"></script>
</body>
</html>
