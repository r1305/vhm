<!doctype html>
<html lang="es" data-product="tribu" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luma Admin — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <style>
    :root {
      --card: var(--surface);
      --muted: var(--text-secondary);
      --gradient: linear-gradient(135deg, var(--primary), var(--primary-hover));
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background: var(--gradient); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .box {
      background: var(--card); border-radius: 24px; padding: 48px 40px 40px;
      width: 100%; max-width: 400px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      border: 1px solid var(--border);
    }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    h2 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    p { font-size: .85rem; color: var(--muted); margin-bottom: 28px; }
    input {
      width: 100%; padding: 14px 16px; margin-bottom: 12px;
      border: 2px solid var(--border); border-radius: 12px;
      font-size: .95rem; background: var(--bg); color: var(--text);
      font-family: inherit; transition: border-color .2s;
      min-height: var(--control-min-h);
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
    .pw-wrap { position: relative; margin-bottom: 12px; }
    .pw-wrap input { margin-bottom: 0; padding-right: 48px; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--muted); font-size: 1.1rem; line-height: 1;
    }
    button#btn-login {
      width: 100%; padding: 14px; margin-top: 8px;
      background: var(--gradient); color: var(--on-primary);
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; min-height: var(--control-min-h);
      font-family: inherit; transition: opacity .15s;
    }
    button#btn-login:hover:not(:disabled) { opacity: .92; }
    button#btn-login:disabled { opacity: .55; cursor: not-allowed; }
    .error {
      display: none; color: var(--danger); font-size: .85rem;
      background: var(--danger-bg); border: 1px solid var(--danger);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; text-align: left;
    }
    @media (max-width: 480px) { .box { padding: 32px 24px 28px; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🎪</div>
    <h2>Luma Admin</h2>
    <p>Gestión de eventos Tribu</p>
    <div class="error" id="error-msg"></div>
    <input type="text" id="email" placeholder="Usuario o correo" autocomplete="username">
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar contraseña">👁</button>
    </div>
    <button type="button" id="btn-login">Iniciar sesión</button>
  </div>
  <script>
    const BASE = (window.__APP_BASE__ || (function () {
      var p = window.location.pathname.replace(/\/+$/, '');
      var i = p.indexOf('/admin');
      return i > 0 ? p.slice(0, i) : '';
    })()).replace(/\/+$/, '');
    const API = BASE + '/api';

    if (localStorage.getItem('luma_token')) {
      window.location.replace(BASE + '/admin/');
    }

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') login();
    });
    document.getElementById('pw-toggle').addEventListener('click', function () {
      var inp = document.getElementById('password');
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      this.textContent = show ? '🙈' : '👁';
    });

    async function login() {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errEl = document.getElementById('error-msg');
      var btn = document.getElementById('btn-login');
      errEl.style.display = 'none';
      if (!email || !password) {
        errEl.textContent = 'Completa todos los campos.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      try {
        var res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ usuario: email, password: password }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok && data.token) {
          localStorage.setItem('luma_token', data.token);
          localStorage.setItem('luma_user', JSON.stringify(data.user));
          window.location.replace(BASE + '/admin/');
          return;
        }
        errEl.textContent = data.error || 'Error al iniciar sesión.';
        errEl.style.display = 'block';
      } catch (e) {
        errEl.textContent = 'Error de conexión.';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  </script>
</body>
</html>
