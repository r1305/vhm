<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>VHM CRM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="app.css">
  <script>(function(){var t=localStorage.getItem('crm-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────── -->
<div id="loginPage" class="login-page" style="display:none">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo"><i class="fas fa-heart-pulse"></i></div>
      <h1>VHM CRM</h1>
      <p>Centro de Psicología — Panel clínico</p>
    </div>
    <div id="loginError" class="badge badge-red" style="display:none;margin-bottom:12px;padding:8px 12px;border-radius:6px;width:100%;text-align:center;font-size:13px;"></div>
    <div class="form-group">
      <label class="form-label">Usuario</label>
      <input type="text" id="loginUsername" class="form-control" placeholder="usuario" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" id="loginBtn">
      <i class="fas fa-right-to-bracket"></i> Ingresar
    </button>
  </div>
</div>

<!-- ── APP ────────────────────────────────────────────── -->
<div id="appPage" class="crm-app" style="display:none">

  <!-- Sidebar -->
  <aside class="crm-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo"><i class="fas fa-heart-pulse"></i></div>
      <span>VHM CRM</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" data-view="dashboard" class="nav-no-terapeuta"><i class="fas fa-gauge-high"></i> Dashboard</button>
      <button class="nav-item" data-view="agenda"><i class="fas fa-calendar-days"></i> Agenda</button>
      <button class="nav-item" data-view="pacientes"><i class="fas fa-users"></i> Pacientes</button>
      <button class="nav-item nav-no-terapeuta" data-view="leads"><i class="fas fa-bullseye"></i> Leads</button>

      <div class="nav-section">Clínico</div>
      <button class="nav-item" data-view="historial"><i class="fas fa-file-medical"></i> Historial</button>
      <button class="nav-item nav-no-terapeuta" data-view="consentimientos"><i class="fas fa-file-signature"></i> Consentimientos</button>

      <div class="nav-section">Administración</div>
      <button class="nav-item nav-no-terapeuta" data-view="pagos"><i class="fas fa-credit-card"></i> Pagos</button>
      <button class="nav-item nav-no-terapeuta" data-view="espera"><i class="fas fa-hourglass-half"></i> Lista de espera</button>
      <button class="nav-item nav-admin" data-view="analitica" style="display:none"><i class="fas fa-chart-line"></i> Analítica web</button>
      <button class="nav-item nav-admin" data-view="marketing" style="display:none"><i class="fas fa-envelope-open-text"></i> Marketing</button>
      <button class="nav-item nav-admin" data-view="asignacion" style="display:none"><i class="fas fa-sitemap"></i> Asignación auto</button>
      <button class="nav-item nav-admin" data-view="integraciones" style="display:none"><i class="fas fa-plug"></i> Integraciones</button>
      <button class="nav-item nav-admin" data-view="terapeutas" style="display:none"><i class="fas fa-user-md"></i> Terapeutas</button>
      <button class="nav-item nav-admin" data-view="reportes" style="display:none"><i class="fas fa-chart-bar"></i> Reportes</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
        <button class="btn-icon" id="logoutBtn" title="Salir"><i class="fas fa-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="crm-main">
    <header class="crm-topbar">
      <button class="btn-icon" id="sidebarToggle" style="display:none"><i class="fas fa-bars"></i></button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <button class="theme-btn" id="themeBtn" title="Cambiar tema"><i class="fas fa-moon"></i></button>
    </header>

    <main class="crm-content" id="crmContent">









    </main>
  </div>
</div>

<!-- ── MODAL ───────────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Formulario</span>
      <button class="btn-icon" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">Guardar</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="app.js"></script>
<script src="citas_modal.js"></script>
<script src="pacientes.js"></script>
<script src="agenda.js"></script>
<script src="terapeutas.js"></script>
<script src="dashboard.js"></script>
<script src="leads.js"></script>
<script src="history.js"></script>
<script src="consent.js"></script>
<script src="payment.js"></script>
<script src="queue.js"></script>
<script src="reportes.js"></script>
<script src="web_analytics.js"></script>
<script src="integraciones.js"></script>
<script src="marketing.js"></script>
<script src="auto_assignment.js"></script>
</body>
</html>
