<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Reclamos - VHM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #c62828; margin-bottom: 5px; font-size: 1.5rem; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: .9rem; }
    .search-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); margin-bottom: 20px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .search-box .field { flex: 1; min-width: 200px; }
    .search-box label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 4px; }
    .search-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .search-box button { padding: 10px 24px; background: #c62828; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; white-space: nowrap; }
    .search-box button:hover { background: #a31515; }

    .no-results { text-align: center; padding: 40px; color: #666; display: none; }
    .results { display: none; }

    .reclamo-card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .reclamo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .reclamo-header h3 { font-size: 1rem; color: #333; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: .75rem; font-weight: 600; }
    .badge-pendiente { background: #fff3e0; color: #e65100; }
    .badge-en_proceso { background: #e3f2fd; color: #1565c0; }
    .badge-resuelto { background: #e8f5e9; color: #2e7d32; }
    .badge-cerrado { background: #eceff1; color: #546e7a; }

    .reclamo-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: .85rem; }
    .reclamo-body .field-label { color: #888; font-size: .75rem; }
    .reclamo-body .field-value { color: #333; }

    .reclamo-detail { margin-top: 12px; font-size: .85rem; border-top: 1px solid #eee; padding-top: 12px; }
    .reclamo-detail p { margin-bottom: 6px; }
    .reclamo-detail strong { color: #555; }

    .respuesta-box { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; padding: 14px; margin-top: 12px; }
    .respuesta-box h4 { color: #2e7d32; font-size: .9rem; margin-bottom: 6px; }
    .respuesta-box p { font-size: .85rem; color: #333; }
    .respuesta-box .fecha { font-size: .75rem; color: #666; margin-top: 6px; }

    .btn-pdf { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: #1565c0; color: #fff; border: none; border-radius: 4px; font-size: .85rem; cursor: pointer; text-decoration: none; margin-top: 12px; }
    .btn-pdf:hover { background: #0d47a1; }

    .nav-links { text-align: center; margin-bottom: 20px; }
    .nav-links a { color: #c62828; text-decoration: none; font-size: .9rem; margin: 0 10px; }
    .nav-links a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 1.2rem; }
      .search-box { flex-direction: column; align-items: stretch; }
      .search-box .field { min-width: auto; }
      .search-box button { width: 100%; padding: 12px; }
      .reclamo-body { grid-template-columns: 1fr; }
      .reclamo-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🔍 Consulta de Reclamos</h1>
  <p class="subtitle">Ingrese su número de documento para consultar el estado de sus reclamos</p>

  <div class="nav-links">
    <a href="/reclamo">← Registrar nuevo reclamo</a>
  </div>

  <div class="search-box">
    <div class="field">
      <label>Número de Documento (DNI / CE / Pasaporte / RUC)</label>
      <input type="text" id="inputDoc" placeholder="Ej: 12345678" maxlength="20">
    </div>
    <button onclick="buscar()">Buscar</button>
  </div>

  <div class="no-results" id="noResults">
    <p>No se encontraron reclamos asociados a este documento.</p>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
  document.getElementById('inputDoc').addEventListener('keypress', e => {
    if (e.key === 'Enter') buscar();
  });

  async function buscar() {
    const doc = document.getElementById('inputDoc').value.trim();
    if (!doc) return alert('Ingrese un número de documento');

    document.getElementById('noResults').style.display = 'none';
    document.getElementById('results').style.display = 'none';

    try {
      const res = await fetch(`/api/reclamos/consulta/${encodeURIComponent(doc)}`);
      const data = await res.json();

      if (data.length === 0) {
        document.getElementById('noResults').style.display = 'block';
        return;
      }

      document.getElementById('results').style.display = 'block';
      document.getElementById('results').innerHTML = data.map(r => `
        <div class="reclamo-card">
          <div class="reclamo-header">
            <h3>📋 ${r.numero_reclamo}</h3>
            <span class="badge badge-${r.estado.toLowerCase()}">${r.estado}</span>
          </div>
          <div class="reclamo-body">
            <div><span class="field-label">Fecha de registro</span><span class="field-value">${new Date(r.fecha_registro).toLocaleDateString('es-PE')}</span></div>
            <div><span class="field-label">Tipo</span><span class="field-value">${r.tipo_reclamo}</span></div>
            <div><span class="field-label">Bien</span><span class="field-value">${r.tipo_bien}</span></div>
            <div><span class="field-label">Monto</span><span class="field-value">S/ ${r.monto_reclamado}</span></div>
          </div>
          <div class="reclamo-detail">
            <p><strong>Descripción:</strong> ${r.descripcion_bien}</p>
            <p><strong>Detalle:</strong> ${r.detalle_reclamo}</p>
            <p><strong>Pedido:</strong> ${r.pedido_consumidor}</p>
          </div>
          ${r.respuesta ? `
            <div class="respuesta-box">
              <h4>✅ Respuesta del proveedor</h4>
              <p>${r.respuesta}</p>
              <p class="fecha">Respondido el: ${new Date(r.fecha_respuesta).toLocaleString('es-PE')}</p>
            </div>
          ` : ''}
          <a class="btn-pdf" href="/api/reclamos/${r.id}/pdf" target="_blank">📄 Descargar PDF</a>
        </div>
      `).join('');
    } catch {
      alert('Error al consultar. Intente nuevamente.');
    }
  }
</script>
</body>
</html>
