<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - VHM</title>
  <link rel="icon" type="image/jpeg" href="/logo_vhm.jpeg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f0eb; }

    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #111; border: 1px solid #222; padding: 40px; border-radius: 8px; width: 100%; max-width: 360px; }
    .login-box h2 { text-align: center; margin-bottom: 20px; color: #c8e6f0; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #333; border-radius: 4px; font-size: 1rem; background: #1a1a1a; color: #f5f0eb; }
    .login-box input:focus { outline: none; border-color: #c8e6f0; }
    .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #f5f0eb, #c8e6f0); color: #000; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-box button:disabled { opacity: .7; cursor: not-allowed; }
    .login-box .error { color: #f08080; font-size: .85rem; margin-bottom: 10px; display: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.3); border-top-color: #000; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .admin-container { display: none; }
    .topbar { background: #111; border-bottom: 1px solid #222; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .topbar h1 { font-size: 1rem; color: #c8e6f0; }
    .topbar .user-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar .user-info span { font-size: .85rem; color: #aaa; }
    .topbar button { background: #1a1a1a; border: 1px solid #333; color: #c8e6f0; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: .85rem; }
    .topbar button:hover { border-color: #c8e6f0; }

    .tabs { display: flex; background: #0d0d0d; border-bottom: 1px solid #222; padding: 0 16px; overflow-x: auto; }
    .tabs button { padding: 12px 16px; border: none; background: none; cursor: pointer; font-size: .9rem; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; color: #888; }
    .tabs button.active { border-bottom-color: #c8e6f0; color: #c8e6f0; font-weight: 600; }

    .content { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; background: #111; border-radius: 6px; overflow: hidden; border: 1px solid #222; min-width: 600px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a1a1a; font-size: .85rem; }
    th { background: #0d0d0d; font-weight: 600; color: #c8e6f0; white-space: nowrap; }
    td { color: #ccc; }

    .badge { padding: 3px 8px; border-radius: 12px; font-size: .75rem; font-weight: 600; display: inline-block; }
    .badge-pendiente { background: #3d2800; color: #ffb74d; }
    .badge-en_proceso { background: #0a2540; color: #64b5f6; }
    .badge-resuelto { background: #0a2a0a; color: #6fcf6f; }
    .badge-cerrado { background: #1a1a1a; color: #999; }

    .btn { padding: 7px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: .8rem; display: inline-block; margin: 2px; font-weight: 500; }
    .btn-primary { background: #c8e6f0; color: #000; }
    .btn-danger { background: #5a1a1a; color: #f08080; border: 1px solid #8a2a2a; }
    .btn-success { background: #0a2a0a; color: #6fcf6f; border: 1px solid #2a5a2a; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 24px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; font-size: 1.1rem; color: #c8e6f0; }
    .modal label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 4px; margin-top: 10px; color: #aaa; }
    .modal input, .modal textarea, .modal select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 4px; font-size: .95rem; background: #1a1a1a; color: #f5f0eb; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #c8e6f0; }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .modal hr { border-color: #222; margin: 16px 0; }

    .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .pagination button { padding: 8px 14px; border: 1px solid #333; background: #111; color: #c8e6f0; border-radius: 4px; cursor: pointer; }
    .pagination button:disabled { opacity: .3; cursor: default; }
    .pagination span { font-size: .85rem; color: #888; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .detail-grid div { font-size: .85rem; color: #ccc; }
    .detail-grid strong { display: block; color: #c8e6f0; font-size: .75rem; }
    .respuesta-box { background: #0a2a0a; border: 1px solid #2a5a2a; padding: 12px; border-radius: 6px; margin-top: 10px; color: #ccc; font-size: .85rem; }

    .form-group-cfg { margin-bottom: 14px; }
    .form-group-cfg label { display: block; font-size: .85rem; color: #aaa; margin-bottom: 4px; }
    .form-group-cfg input, .form-group-cfg select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 4px; background: #1a1a1a; color: #f5f0eb; font-size: .95rem; }
    .form-group-cfg input:focus, .form-group-cfg select:focus { outline: none; border-color: #c8e6f0; }

    .mobile-cards { display: none; }
    .mobile-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .mobile-card .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .mobile-card .mc-header strong { font-size: .85rem; color: #f5f0eb; }
    .mobile-card .mc-row { font-size: .8rem; color: #888; margin-bottom: 4px; }
    .mobile-card .mc-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

    @media (max-width: 768px) {
      .topbar h1 { font-size: .9rem; }
      .content { padding: 12px; }
      .detail-grid { grid-template-columns: 1fr; }
      .modal { padding: 16px; }
      .table-wrapper { display: none; }
      .mobile-cards { display: block; }
    }
    @media (min-width: 769px) {
      .mobile-cards { display: none !important; }
      .table-wrapper { display: block !important; }
    }
  </style>
</head>
<body>

<div class="login-container" id="loginSection">
  <div class="login-box">
    <h2>🔐 Administración VHM</h2>
    <div class="error" id="loginError"></div>
    <input type="text" id="loginUser" placeholder="Usuario">
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button id="btnLogin" onclick="login()"><span class="spinner" id="loginSpinner"></span><span id="btnLoginText">Ingresar</span></button>
  </div>
</div>

<div class="admin-container" id="adminSection">
  <div class="topbar">
    <h1>📋 Panel Admin - VHM</h1>
    <div class="user-info">
      <span id="currentUser"></span>
      <button onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="tabs">
    <button class="active" onclick="switchTab('reclamos')">Reclamos</button>
    <button onclick="switchTab('usuarios')">Usuarios</button>
    <button id="tabConfig" style="display:none" onclick="switchTab('config')">⚙️ Configuración</button>
  </div>
  <div class="content">
    <div class="panel active" id="panelReclamos">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>N° Reclamo</th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Respuesta</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="reclamosBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="reclamosMobile"></div>
      <div class="pagination">
        <button onclick="cambiarPagina(-1)" id="btnPrev">← Anterior</button>
        <span id="paginaInfo"></span>
        <button onclick="cambiarPagina(1)" id="btnNext">Siguiente →</button>
      </div>
    </div>

    <div class="panel" id="panelUsuarios">
      <button class="btn btn-primary" onclick="mostrarModalUsuario()" style="margin-bottom:12px">+ Nuevo Usuario</button>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Username</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th>Acciones</th></tr>
          </thead>
          <tbody id="usuariosBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="usuariosMobile"></div>
    </div>

    <!-- PANEL CONFIGURACIÓN EMAIL -->
    <div class="panel" id="panelConfig">
      <div style="max-width:560px">
        <h3 style="color:#c8e6f0;margin-bottom:20px">⚙️ Configuración de Correo SMTP</h3>
        <div class="form-group-cfg">
          <label>Servidor SMTP (Host)</label>
          <input type="text" id="cfgHost" placeholder="smtp.tudominio.com">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group-cfg">
            <label>Puerto</label>
            <input type="number" id="cfgPort" placeholder="465">
          </div>
          <div class="form-group-cfg">
            <label>Seguro (SSL/TLS)</label>
            <select id="cfgSecure">
              <option value="1">Sí (SSL)</option>
              <option value="0">No (STARTTLS)</option>
            </select>
          </div>
        </div>
        <div class="form-group-cfg">
          <label>Usuario / Email SMTP</label>
          <input type="text" id="cfgUser" placeholder="noreply@tudominio.com">
        </div>
        <div class="form-group-cfg">
          <label>Contraseña SMTP <span style="color:#666;font-size:.8rem">(dejar vacío para no cambiar)</span></label>
          <input type="password" id="cfgPass" placeholder="••••••••">
        </div>
        <div class="form-group-cfg">
          <label>Email remitente (From)</label>
          <input type="email" id="cfgEmailFrom" placeholder="noreply@tudominio.com">
        </div>
        <div class="form-group-cfg">
          <label>Nombre remitente</label>
          <input type="text" id="cfgNombreFrom" placeholder="VHM - Libro de Reclamaciones">
        </div>
        <div style="margin-top:8px;font-size:.8rem;color:#666" id="cfgFechaActualizacion"></div>
        <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="guardarConfig()" style="padding:10px 20px">Guardar Configuración</button>
          <button class="btn btn-success" onclick="probarConfig()" style="padding:10px 20px">Enviar Correo de Prueba</button>
        </div>
        <div id="cfgMsg" style="margin-top:12px;padding:10px;border-radius:4px;display:none;font-size:.85rem"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETALLE RECLAMO -->
<div class="modal-overlay" id="modalDetalle">
  <div class="modal">
    <h3>Detalle del Reclamo</h3>
    <div id="detalleContent"></div>
    <hr>
    <div id="respuestaSection">
      <label><strong>Responder al reclamo:</strong></label>
      <textarea id="txtRespuesta" placeholder="Escriba la respuesta..."></textarea>
      <div class="modal-actions">
        <button class="btn" style="background:#1a1a1a;color:#aaa;border:1px solid #333" onclick="cerrarModal('modalDetalle')">Cerrar</button>
        <button class="btn btn-primary" onclick="enviarRespuesta()">Enviar Respuesta y Notificar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL USUARIO -->
<div class="modal-overlay" id="modalUsuario">
  <div class="modal">
    <h3 id="modalUsuarioTitle">Nuevo Usuario</h3>
    <input type="hidden" id="usuarioId">
    <label>Username</label><input type="text" id="uUsername">
    <label>Nombre</label><input type="text" id="uNombre">
    <label>Email</label><input type="email" id="uEmail">
    <label>Contraseña</label><input type="password" id="uPassword" placeholder="Dejar vacío para no cambiar">
    <label>Rol</label>
    <select id="uRol"><option value="ADMIN">Administrador</option></select>
    <div class="modal-actions">
      <button class="btn" style="background:#1a1a1a;color:#aaa;border:1px solid #333" onclick="cerrarModal('modalUsuario')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('token');
let currentPage = 1;
let reclamoSeleccionado = null;

function isSuperAdmin() {
  return (JSON.parse(localStorage.getItem('user') || '{}')).rol === 'SUPER_ADMIN';
}

if (token) initAdmin();

async function login() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnLogin');
  const spinner = document.getElementById('loginSpinner');
  const btnText = document.getElementById('btnLoginText');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Ingresando...';
  document.getElementById('loginError').style.display = 'none';
  try {
    const res = await fetch(`${API}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (!res.ok) { document.getElementById('loginError').textContent = data.error; document.getElementById('loginError').style.display = 'block'; return; }
    token = data.token;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(data.user));
    initAdmin();
  } catch { alert('Error de conexión'); }
  finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Ingresar';
  }
}

function initAdmin() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'block';
  document.getElementById('currentUser').textContent = (JSON.parse(localStorage.getItem('user') || '{}')).nombre;
  if (isSuperAdmin()) document.getElementById('tabConfig').style.display = 'block';
  cargarReclamos();
}

function logout() {
  localStorage.removeItem('token'); localStorage.removeItem('user'); token = null;
  document.getElementById('loginSection').style.display = 'flex';
  document.getElementById('adminSection').style.display = 'none';
}

function headers() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }; }

function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`panel${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
  if (tab === 'usuarios') cargarUsuarios();
  if (tab === 'reclamos') cargarReclamos();
  if (tab === 'config') cargarConfig();
}

async function cargarReclamos() {
  try {
    const res = await fetch(`${API}/reclamos?page=${currentPage}&limit=10`, { headers: headers() });
    if (res.status === 401) return logout();
    const data = await res.json();

    document.getElementById('reclamosBody').innerHTML = data.data.map(r => `
      <tr>
        <td><strong style="color:#c8e6f0">${r.numero_reclamo}</strong></td>
        <td>${new Date(r.fecha_registro).toLocaleDateString('es-PE')}</td>
        <td>${r.nombres} ${r.apellidos}</td>
        <td>${r.tipo_reclamo}</td>
        <td><span class="badge badge-${r.estado.toLowerCase()}">${r.estado}</span></td>
        <td>${r.respuesta ? '✅' : '⏳'}</td>
        <td>
          <button class="btn btn-primary" onclick="verDetalle(${r.id})">Ver</button>
          <a class="btn btn-success" href="/api/reclamos/${r.id}/pdf" target="_blank" style="text-decoration:none">PDF</a>
          ${isSuperAdmin() ? `<button class="btn btn-danger" onclick="eliminarReclamo(${r.id})">🗑</button>` : ''}
        </td>
      </tr>
    `).join('');

    document.getElementById('reclamosMobile').innerHTML = data.data.map(r => `
      <div class="mobile-card">
        <div class="mc-header">
          <strong>${r.numero_reclamo}</strong>
          <span class="badge badge-${r.estado.toLowerCase()}">${r.estado}</span>
        </div>
        <div class="mc-row">📅 ${new Date(r.fecha_registro).toLocaleDateString('es-PE')}</div>
        <div class="mc-row">👤 ${r.nombres} ${r.apellidos}</div>
        <div class="mc-row">📌 ${r.tipo_reclamo} | ${r.respuesta ? '✅ Respondido' : '⏳ Pendiente'}</div>
        <div class="mc-actions">
          <button class="btn btn-primary" onclick="verDetalle(${r.id})">Ver / Responder</button>
          <a class="btn btn-success" href="/api/reclamos/${r.id}/pdf" target="_blank" style="text-decoration:none">📄 PDF</a>
          ${isSuperAdmin() ? `<button class="btn btn-danger" onclick="eliminarReclamo(${r.id})">🗑 Eliminar</button>` : ''}
        </div>
      </div>
    `).join('');

    document.getElementById('paginaInfo').textContent = `${data.page} / ${data.totalPages}`;
    document.getElementById('btnPrev').disabled = data.page <= 1;
    document.getElementById('btnNext').disabled = data.page >= data.totalPages;
  } catch { alert('Error cargando reclamos'); }
}

function cambiarPagina(dir) { currentPage += dir; cargarReclamos(); }

async function verDetalle(id) {
  const res = await fetch(`${API}/reclamos/${id}`, { headers: headers() });
  const r = await res.json();
  reclamoSeleccionado = r;
  document.getElementById('detalleContent').innerHTML = `
    <div class="detail-grid">
      <div><strong>N° Reclamo</strong>${r.numero_reclamo}</div>
      <div><strong>Fecha</strong>${new Date(r.fecha_registro).toLocaleString('es-PE')}</div>
      <div><strong>Cliente</strong>${r.nombres} ${r.apellidos}</div>
      <div><strong>Documento</strong>${r.tipo_documento}: ${r.numero_documento}</div>
      <div><strong>Email</strong>${r.email}</div>
      <div><strong>Teléfono</strong>${r.telefono}</div>
      <div><strong>Dirección</strong>${r.direccion}, ${r.distrito}, ${r.provincia}, ${r.departamento}</div>
      <div><strong>Tipo Bien</strong>${r.tipo_bien}</div>
      <div><strong>Monto</strong>S/ ${r.monto_reclamado}</div>
      <div><strong>Tipo</strong>${r.tipo_reclamo}</div>
      <div><strong>Estado</strong>${r.estado}</div>
      <div><strong>Fecha Incidente</strong>${r.fecha_incidente}</div>
    </div>
    <div style="margin-bottom:8px"><strong style="color:#c8e6f0">Descripción del bien:</strong><p style="color:#aaa;margin-top:4px">${r.descripcion_bien}</p></div>
    <div style="margin-bottom:8px"><strong style="color:#c8e6f0">Detalle del reclamo:</strong><p style="color:#aaa;margin-top:4px">${r.detalle_reclamo}</p></div>
    <div style="margin-bottom:8px"><strong style="color:#c8e6f0">Pedido del consumidor:</strong><p style="color:#aaa;margin-top:4px">${r.pedido_consumidor}</p></div>
    ${r.respuesta ? `<div class="respuesta-box"><strong style="color:#6fcf6f">Respuesta enviada (${new Date(r.fecha_respuesta).toLocaleString('es-PE')}):</strong><p style="margin-top:6px">${r.respuesta}</p></div>` : ''}
  `;
  const mostrarRespuesta = !r.respuesta || isSuperAdmin();
  document.getElementById('respuestaSection').style.display = mostrarRespuesta ? 'block' : 'none';
  document.getElementById('txtRespuesta').value = r.respuesta || '';
  document.getElementById('modalDetalle').classList.add('show');
}

async function enviarRespuesta() {
  const respuesta = document.getElementById('txtRespuesta').value.trim();
  if (!respuesta) return alert('Escriba una respuesta');
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const res = await fetch(`${API}/reclamos/${reclamoSeleccionado.id}/responder`, { method: 'POST', headers: headers(), body: JSON.stringify({ respuesta }) });
    const data = await res.json();
    if (res.ok) { alert(`Respuesta registrada. ${data.emailEnviado ? 'Email enviado.' : 'No se pudo enviar el email.'}`); cerrarModal('modalDetalle'); cargarReclamos(); }
    else { alert(data.error); }
  } catch { alert('Error de conexión'); }
  finally { btn.disabled = false; btn.textContent = 'Enviar Respuesta y Notificar'; }
}

async function eliminarReclamo(id) {
  if (!confirm('¿Eliminar este reclamo? Esta acción no se puede deshacer.')) return;
  try {
    const res = await fetch(`${API}/reclamos/${id}`, { method: 'DELETE', headers: headers() });
    const data = await res.json();
    if (res.ok) cargarReclamos(); else alert(data.error);
  } catch { alert('Error de conexión'); }
}

async function cargarUsuarios() {
  const res = await fetch(`${API}/usuarios`, { headers: headers() });
  if (res.status === 401) return logout();
  const data = await res.json();

  document.getElementById('usuariosBody').innerHTML = data.map(u => `
    <tr>
      <td style="color:#c8e6f0">${u.username}</td>
      <td>${u.nombre}</td><td>${u.email}</td><td>${u.rol}</td>
      <td>${u.activo ? '✅' : '❌'}</td>
      <td>${u.es_protegido ? '<em style="font-size:.8rem;color:#555">Protegido</em>' : `
        <button class="btn btn-primary" onclick='editarUsuario(${JSON.stringify(u)})'>Editar</button>
        <button class="btn btn-danger" onclick="eliminarUsuario(${u.id})">Eliminar</button>
      `}</td>
    </tr>
  `).join('');

  document.getElementById('usuariosMobile').innerHTML = data.map(u => `
    <div class="mobile-card">
      <div class="mc-header"><strong>${u.username}</strong><span class="badge" style="background:#0a2540;color:#64b5f6">${u.rol}</span></div>
      <div class="mc-row">👤 ${u.nombre}</div>
      <div class="mc-row">📧 ${u.email}</div>
      <div class="mc-row">${u.activo ? '✅ Activo' : '❌ Inactivo'}</div>
      <div class="mc-actions">${u.es_protegido ? '<em style="font-size:.8rem;color:#555">Protegido</em>' : `
        <button class="btn btn-primary" onclick='editarUsuario(${JSON.stringify(u)})'>Editar</button>
        <button class="btn btn-danger" onclick="eliminarUsuario(${u.id})">Eliminar</button>
      `}</div>
    </div>
  `).join('');
}

function mostrarModalUsuario() {
  document.getElementById('modalUsuarioTitle').textContent = 'Nuevo Usuario';
  ['usuarioId','uUsername','uNombre','uEmail','uPassword'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('uUsername').disabled = false;
  document.getElementById('modalUsuario').classList.add('show');
}

function editarUsuario(u) {
  document.getElementById('modalUsuarioTitle').textContent = 'Editar Usuario';
  document.getElementById('usuarioId').value = u.id;
  document.getElementById('uUsername').value = u.username;
  document.getElementById('uUsername').disabled = true;
  document.getElementById('uNombre').value = u.nombre;
  document.getElementById('uEmail').value = u.email;
  document.getElementById('uPassword').value = '';
  document.getElementById('modalUsuario').classList.add('show');
}

async function guardarUsuario() {
  const id = document.getElementById('usuarioId').value;
  const body = { username: document.getElementById('uUsername').value, nombre: document.getElementById('uNombre').value, email: document.getElementById('uEmail').value, rol: document.getElementById('uRol').value };
  const pass = document.getElementById('uPassword').value;
  if (pass) body.password = pass;
  if (!id && !pass) return alert('La contraseña es obligatoria para nuevos usuarios');
  const res = await fetch(id ? `${API}/usuarios/${id}` : `${API}/usuarios`, { method: id ? 'PUT' : 'POST', headers: headers(), body: JSON.stringify(body) });
  const data = await res.json();
  if (res.ok) { cerrarModal('modalUsuario'); cargarUsuarios(); } else alert(data.error);
}

async function eliminarUsuario(id) {
  if (!confirm('¿Eliminar este usuario?')) return;
  const res = await fetch(`${API}/usuarios/${id}`, { method: 'DELETE', headers: headers() });
  const data = await res.json();
  if (res.ok) cargarUsuarios(); else alert(data.error);
}

function cerrarModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }); });

// CONFIG EMAIL
async function cargarConfig() {
  try {
    const res = await fetch(`${API}/config-email`, { headers: headers() });
    const d = await res.json();
    document.getElementById('cfgHost').value = d.smtp_host || '';
    document.getElementById('cfgPort').value = d.smtp_port || 465;
    document.getElementById('cfgSecure').value = d.smtp_secure !== undefined ? String(d.smtp_secure) : '1';
    document.getElementById('cfgUser').value = d.smtp_user || '';
    document.getElementById('cfgEmailFrom').value = d.email_from || '';
    document.getElementById('cfgNombreFrom').value = d.nombre_from || '';
    document.getElementById('cfgPass').value = '';
    if (d.fecha_actualizacion) {
      document.getElementById('cfgFechaActualizacion').textContent = `Última actualización: ${new Date(d.fecha_actualizacion).toLocaleString('es-PE')}`;
    }
  } catch { mostrarMsgConfig('Error al cargar configuración', false); }
}

async function guardarConfig() {
  const body = {
    smtp_host: document.getElementById('cfgHost').value.trim(),
    smtp_port: parseInt(document.getElementById('cfgPort').value),
    smtp_secure: document.getElementById('cfgSecure').value === '1',
    smtp_user: document.getElementById('cfgUser').value.trim(),
    smtp_pass: document.getElementById('cfgPass').value,
    email_from: document.getElementById('cfgEmailFrom').value.trim(),
    nombre_from: document.getElementById('cfgNombreFrom').value.trim()
  };
  try {
    const res = await fetch(`${API}/config-email`, { method: 'PUT', headers: headers(), body: JSON.stringify(body) });
    const d = await res.json();
    mostrarMsgConfig(res.ok ? '✅ ' + d.message : '❌ ' + d.error, res.ok);
  } catch { mostrarMsgConfig('❌ Error de conexión', false); }
}

async function probarConfig() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const res = await fetch(`${API}/config-email/test`, { method: 'POST', headers: headers() });
    const d = await res.json();
    mostrarMsgConfig(res.ok ? '✅ ' + d.message : '❌ ' + d.error, res.ok);
  } catch { mostrarMsgConfig('❌ Error de conexión', false); }
  finally { btn.disabled = false; btn.textContent = 'Enviar Correo de Prueba'; }
}

function mostrarMsgConfig(texto, ok) {
  const el = document.getElementById('cfgMsg');
  el.textContent = texto;
  el.style.display = 'block';
  el.style.background = ok ? '#0a2a0a' : '#2a0a0a';
  el.style.color = ok ? '#6fcf6f' : '#f08080';
  el.style.border = ok ? '1px solid #2a5a2a' : '1px solid #5a2a2a';
}
</script>
</body>
