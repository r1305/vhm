<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Biblioteca — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <link rel="stylesheet" href="css/member-app.css">
  <link rel="stylesheet" href="css/member-inicio.css">
  <link rel="stylesheet" href="css/member-pages.css">
</head>
<body class="member-start member-page library">

<div class="page-shell member-page-shell library no-trial" data-member-main>
  <div class="member-start-trial" id="memberTrialStrip" hidden></div>
  <header class="member-page-hero">
    <p class="member-page-eyebrow">Biblioteca</p>
    <h1>¿Qué necesitas hoy?</h1>
    <p class="member-page-lead">Herramientas para volver al presente, comprender y dar tu siguiente paso.</p>
  </header>

  <div class="lib-guide-toolbar">
    <label class="lib-guide-search-label" for="libSearch">Buscar por tema o título</label>
    <input type="search" id="libSearch" class="lib-guide-search" placeholder="Por ejemplo: ansiedad, límites o relaciones" autocomplete="off">
    <div class="lib-guide-filters" id="libFilters" role="tablist" aria-label="Filtrar por tema"></div>
  </div>

  <section class="lib-guide-section">
    <h2>Un recurso para cada momento.</h2>
    <div id="contenido">
      <div class="member-empty">Cargando recursos…</div>
    </div>
    <p class="lib-guide-note">El catálogo crece con guías y videos reales de La Tribu.</p>
  </section>

</div>

<div class="library">
  <div class="player-overlay" id="playerOverlay">
    <div class="player-box">
      <div class="player-frame">
        <button class="close-btn" type="button" onclick="cerrarPlayer()" aria-label="Cerrar">&times;</button>
        <div id="playerMount"></div>
      </div>
      <div class="player-info">
        <h2 id="pTitulo"></h2>
        <div class="p-sub" id="pSub"></div>
        <div class="p-desc" id="pDesc"></div>
        <div class="player-actions">
          <button type="button" class="like-btn" id="pLike" onclick="toggleLike()">🤍 <span id="pLikeCount">0</span></button>
          <span id="pVistas"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando…</div>
  </div>
</div>

<script src="js/tribu-common.js"></script>
<script src="js/tribu-contenido.js"></script>
<script src="js/funnel-utils.js"></script>
<script src="js/member-app.js"></script>
<script src="js/recursos.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await MemberApp.init({ requireSub: true, layout: 'funnel' });
  if (ok && typeof window.cargarRecursosBiblioteca === 'function') window.cargarRecursosBiblioteca();
});
</script>
</body>
</html>
