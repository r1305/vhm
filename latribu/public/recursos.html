<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recursos — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-ui,'Inter',sans-serif); color: var(--txt); background: var(--bg); min-height: 100vh; line-height: 1.45; }
    a { text-decoration: none; }

    .site-nav { position: fixed; top: 0; width: 100%; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .site-nav .tribu-brand { font-family: 'Fraunces',serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; color: var(--tribu-600,#A84F3E); text-decoration: none; }
    .site-nav-end { display: flex; align-items: center; gap: 10px; margin-left: auto; }

    .user-menu { position: relative; z-index: 120; }
    .user-menu-btn { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--tribu-100,#F7ECE9); cursor: pointer; color: var(--txt); font-family: inherit; transition: border-color .2s, background .2s; }
    .user-menu-btn:hover, .user-menu.open .user-menu-btn { border-color: rgba(168,79,62,.55); background: var(--surface-raised,#F0E0DA); }
    .user-menu-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(168,79,62,.35); }
    .user-menu-avatar-ph { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: rgba(168,79,62,.28); color: #fff; font-size: .82rem; font-weight: 800; }
    .user-menu-label { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    .user-menu-name { font-size: .88rem; font-weight: 800; color: var(--txt); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-menu-sub { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .user-menu-chevron { margin-left: 2px; color: var(--muted); font-size: .75rem; transition: transform .2s; }
    .user-menu.open .user-menu-chevron { transform: rotate(180deg); }
    .user-menu-panel { display: none; position: absolute; top: calc(100% + 10px); right: 0; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 16px 48px rgba(14,23,20,.14); }
    .user-menu.open .user-menu-panel { display: block; animation: menuIn .18s ease; }
    @keyframes menuIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
    .user-menu-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .user-menu-head-name { font-weight: 800; color: var(--txt); font-size: .92rem; }
    .user-menu-head-email { font-size: .78rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .user-menu-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: none; background: none; color: var(--txt); font-family: inherit; font-weight: 700; font-size: .9rem; border-radius: 10px; cursor: pointer; text-align: left; transition: background .15s; text-decoration: none; }
    .user-menu-item:hover { background: var(--tribu-100,#F7ECE9); }
    .user-menu-item .mi { width: 1.35rem; text-align: center; flex-shrink: 0; }
    .user-menu-item.danger { color: var(--danger,#B64A5A); }
    .user-menu-item.danger:hover { background: var(--danger-bg,#FCECEF); }
    .user-menu-divider { height: 1px; background: var(--line); margin: 6px 4px; }
    .nav-login-link { color: var(--muted); font-size: .9rem; font-weight: 700; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }

    .page-shell { padding-top: 80px; min-height: 100vh; }
    .page-inner { max-width: 1160px; margin: 0 auto; padding: 32px 22px 64px; }
    .page-header { margin-bottom: 32px; }
    .account-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: none; color: var(--muted); font-family: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; padding: 0; text-decoration: none; }
    .account-back:hover { color: var(--txt); }
    .page-title { font-family: 'Fraunces',serif; font-size: 1.75rem; font-weight: 700; color: var(--txt); margin: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 26px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; cursor: pointer; transition: transform .25s, box-shadow .25s, border-color .25s; display: flex; flex-direction: column; position: relative; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(135deg,#A84F3E,#8F4234); z-index: 2; }
    .card:hover { transform: translateY(-6px); border-color: rgba(168,79,62,.55); box-shadow: 0 24px 48px -24px rgba(168,79,62,.55); }
    .thumb { position: relative; aspect-ratio: 16/9; background: #F0E0DA; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,rgba(246,248,247,.1),rgba(168,79,62,.4)); opacity: 0; transition: opacity .25s; }
    .card:hover .thumb .play { opacity: 1; }
    .thumb .play span { width: 62px; height: 62px; border-radius: 50%; background: #fff; color: #8F4234; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; padding-left: 4px; box-shadow: 0 8px 26px rgba(168,79,62,.65); }
    .thumb .dur { position: absolute; bottom: 10px; right: 10px; background: rgba(22,32,28,.78); color: #fff; font-size: .74rem; font-weight: 700; padding: 4px 9px; border-radius: 20px; }
    .card-body { padding: 18px 18px 16px; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 { font-family: 'Fraunces',serif; font-size: 1.12rem; font-weight: 600; margin-bottom: 7px; line-height: 1.3; color: var(--txt); }
    .card-body .sub { font-size: .88rem; color: var(--muted); margin-bottom: 14px; flex: 1; line-height: 1.5; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: .82rem; color: var(--muted); font-weight: 700; border-top: 1px solid rgba(168,79,62,.14); padding-top: 12px; }
    .like-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; font-weight: 700; display: flex; align-items: center; gap: 6px; padding: 4px; transition: color .2s; }
    .like-btn.liked, .like-btn:hover { color: #8F4234; }

    .cat-accordion { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; transition: border-color .2s, box-shadow .2s; }
    .cat-accordion.is-open { border-color: rgba(168,79,62,.35); box-shadow: 0 12px 36px -24px rgba(168,79,62,.35); }
    .cat-accordion-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; background: transparent; border: none; cursor: pointer; text-align: left; font-family: 'Fraunces',serif; font-size: 1.5rem; font-weight: 700; color: var(--txt); transition: background .2s; }
    .cat-accordion-trigger:hover { background: rgba(168,79,62,.06); }
    .cat-title-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cat-title-main::before { content: ''; width: 38px; height: 5px; border-radius: 5px; flex-shrink: 0; background: linear-gradient(135deg,#A84F3E,#8F4234); box-shadow: 0 0 14px rgba(168,79,62,.7); }
    .cat-accordion-count { font-family: 'Inter',sans-serif; font-size: .78rem; font-weight: 800; color: var(--muted); margin-left: 8px; white-space: nowrap; }
    .cat-accordion-chevron { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(168,79,62,.12); border: 1px solid rgba(168,79,62,.25); color: var(--muted); font-size: .9rem; transition: transform .25s, background .2s; }
    .cat-accordion.is-open .cat-accordion-chevron { transform: rotate(180deg); background: rgba(168,79,62,.18); }
    .cat-accordion-panel { display: none; padding: 0 22px 26px; }
    .cat-accordion.is-open .cat-accordion-panel { display: block; animation: panelIn .22s ease; }
    @keyframes panelIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
    .cat-desc { color: var(--muted); font-size: .98rem; margin-bottom: 22px; max-width: 640px; line-height: 1.6; }

    .empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 1.05rem; font-weight: 600; background: rgba(168,79,62,.04); border-radius: 20px; border: 1px dashed rgba(168,79,62,.35); }
    .lock-banner { margin: 0 0 32px; padding: 28px 24px; background: rgba(168,79,62,.08); border: 1px solid rgba(168,79,62,.35); border-radius: 18px; text-align: center; }
    .lock-banner .lock-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .lock-banner h3 { font-family: 'Fraunces',serif; font-size: 1.3rem; color: var(--txt); margin-bottom: 8px; }
    .lock-banner p { color: var(--muted); font-size: .92rem; line-height: 1.6; margin-bottom: 18px; }
    .lock-banner .lock-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .lock-btn { padding: 11px 24px; border-radius: 30px; font-size: .9rem; font-weight: 800; font-family: inherit; cursor: pointer; border: none; transition: transform .15s, opacity .2s; }
    .lock-btn:hover { transform: translateY(-2px); opacity: .9; }
    .lock-btn-primary { background: linear-gradient(135deg,#A84F3E,#8F4234); color: #fff; }
    .lock-btn-outline { background: transparent; border: 1px solid rgba(168,79,62,.5); color: #8F4234; }
    .tribu-locked { position: relative; pointer-events: none; user-select: none; }
    .tribu-locked::after { content: ''; position: absolute; inset: 0; backdrop-filter: blur(7px); background: rgba(246,248,247,.55); z-index: 10; border-radius: 12px; }

    .player-overlay { display: none; position: fixed; inset: 0; background: rgba(12,18,16,.48); backdrop-filter: blur(6px); z-index: 1000; padding: 20px; overflow-y: auto; }
    .player-overlay.show { display: flex; align-items: flex-start; justify-content: center; }
    .player-box { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; width: 100%; max-width: 880px; margin: auto; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(168,79,62,.4); }
    .player-frame { position: relative; aspect-ratio: 16/9; background: #000; }
    .player-frame iframe, .player-frame video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-info { padding: 24px 28px 30px; }
    .player-info h2 { font-family: 'Fraunces',serif; font-weight: 600; font-size: 1.5rem; margin-bottom: 8px; color: var(--txt); }
    .player-info .p-sub { color: var(--muted); font-weight: 700; font-size: .95rem; margin-bottom: 16px; }
    .player-info .p-desc { color: var(--muted); line-height: 1.8; font-size: .95rem; margin-bottom: 20px; white-space: pre-wrap; }
    .player-actions { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; font-weight: 700; border-top: 1px solid rgba(168,79,62,.16); padding-top: 18px; }
    .close-btn { position: absolute; top: 16px; right: 18px; z-index: 5; background: #fff; color: var(--txt); border: 1px solid var(--line); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.4rem; transition: transform .2s, background .2s; box-shadow: 0 4px 12px rgba(22,32,28,.08); }
    .close-btn:hover { transform: rotate(90deg); background: #F7ECE9; color: #8F4234; }

    .page-loader { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(14,23,20,.38); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .page-loader.show { display: flex; }
    .page-loader-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 36px; text-align: center; min-width: 180px; }
    .page-loader-spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(168,79,62,.2); border-top-color: #A84F3E; animation: spin .75s linear infinite; margin: 0 auto 12px; }
    .page-loader-text { font-size: .88rem; font-weight: 700; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: #fff; color: var(--muted); text-align: center; padding: 32px 20px; font-size: .9rem; font-weight: 600; border-top: 1px solid var(--line); position: relative; }
    footer::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 3px; background: linear-gradient(135deg,#A84F3E,#8F4234); }

    @media (max-width: 768px) {
      .page-inner { padding: 24px 16px 48px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .cat-accordion-trigger { font-size: 1.1rem; padding: 14px 16px; }
      .cat-accordion-panel { padding: 0 14px 18px; }
      .player-overlay { padding: 10px; align-items: flex-start; }
      .player-info { padding: 18px 16px 22px; }
      .player-info h2 { font-size: 1.2rem; }
      .close-btn { width: 44px; height: 44px; top: 10px; right: 10px; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="/" class="tribu-brand">La Tribu</a>
  <div class="site-nav-end" id="navAuthArea"></div>
</nav>

<div class="page-shell">
  <div class="page-inner">
    <header class="page-header">
      <a href="/" class="account-back">← Volver a La Tribu</a>
      <h1 class="page-title">📚 Recursos</h1>
    </header>
    <div id="contenido">
      <div class="empty">Cargando recursos...</div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; <script>document.write(new Date().getFullYear())</script> VHM - Bienestar, Relaciones &amp; Superación Personal.</p>
</footer>

<!-- Modal reproductor -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <div class="player-frame">
      <button class="close-btn" onclick="cerrarPlayer()">&times;</button>
      <div id="playerMount"></div>
    </div>
    <div class="player-info">
      <h2 id="pTitulo"></h2>
      <div class="p-sub" id="pSub"></div>
      <div class="p-desc" id="pDesc"></div>
      <div class="player-actions">
        <button class="like-btn" id="pLike" onclick="toggleLike()">🤍 <span id="pLikeCount">0</span></button>
        <span id="pVistas"></span>
      </div>
    </div>
  </div>
</div>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando...</div>
  </div>
</div>

<script src="js/tribu-common.js"></script>
<script src="js/recursos.js"></script>
</body>
</html>
