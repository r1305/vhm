<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi membresía — La Tribu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <link rel="stylesheet" href="css/member-app.css">
  <link rel="stylesheet" href="css/member-inicio.css">
  <link rel="stylesheet" href="css/member-pages.css">
  <link rel="stylesheet" href="css/member-membresia.css">
  <link rel="stylesheet" href="css/member-account.css">
</head>
<body class="member-start member-membership">

<main class="member-membership-main no-trial" data-member-main>
  <div class="member-start-trial" id="memberTrialStrip" hidden></div>

  <section class="member-membership-settings">
    <header class="member-page-hero member-membership-hero">
      <p class="member-page-eyebrow">Mi membresía</p>
      <h1>Tu espacio, tu decisión.</h1>
      <p class="member-page-lead">Puedes revisar tu prueba y administrar la renovación aquí.</p>
    </header>

    <div id="memberMembershipCard" class="member-membership-card" aria-live="polite">
      <p class="member-membership-micro member-membership-loading">Cargando tu membresía…</p>
    </div>

    <div class="member-membership-actions">
      <a class="member-membership-btn-secondary member-membership-back" href="./inicio">Volver a mi inicio</a>
      <button type="button" class="member-membership-help" id="membershipHelpBtn">Necesito ayuda</button>
    </div>
  </section>
</main>

<div class="auth-overlay" id="planesOverlay">
  <div class="auth-box" style="max-width:520px;position:relative">
    <button type="button" class="auth-close" onclick="cerrarModalPlanes()" aria-label="Cerrar">&times;</button>
    <p class="member-start-eyebrow" style="margin-bottom:10px">La Tribu</p>
    <h2 style="font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:12px">Plan disponible</h2>
    <div id="planesLista"></div>
    <div id="planesError" class="auth-error"></div>
  </div>
</div>

<div class="auth-overlay" id="tribuFeedbackOverlay" role="dialog" aria-modal="true">
  <div class="auth-box tribu-feedback-box">
    <div class="tribu-feedback-icon success" id="tribuFeedbackIcon">✓</div>
    <div class="tribu-feedback-eyebrow">La Tribu</div>
    <div id="tribuFeedbackTitle" style="text-align:center;font-size:1.1rem;font-weight:800;margin-bottom:4px"></div>
    <p class="tribu-feedback-msg" id="tribuFeedbackMsg"></p>
    <button type="button" class="auth-btn" id="tribuFeedbackBtn" onclick="cerrarTribuFeedback()">Continuar</button>
  </div>
</div>

<div class="auth-overlay" id="tribuConfirmOverlay" role="dialog" aria-modal="true">
  <div class="auth-box" style="text-align:center">
    <div class="tribu-feedback-icon warn">?</div>
    <div class="tribu-feedback-eyebrow">La Tribu</div>
    <div id="tribuConfirmTitle" style="font-weight:800;margin-bottom:4px"></div>
    <p class="tribu-feedback-msg" id="tribuConfirmMsg"></p>
    <div class="tribu-confirm-actions">
      <button type="button" class="tribu-confirm-btn outline" id="tribuConfirmCancel">Volver</button>
      <button type="button" class="tribu-confirm-btn danger" id="tribuConfirmOk">Confirmar</button>
    </div>
  </div>
</div>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando…</div>
  </div>
</div>

<script src="js/funnel-utils.js"></script>
<script src="js/tribu-common.js"></script>
<script src="js/member-app.js"></script>
<script src="js/suscripciones.js"></script>
</body>
</html>
