<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){document.documentElement.removeAttribute('data-theme');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Nueva contraseña — La Tribu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <link rel="stylesheet" href="css/funnel.css">
  <link rel="stylesheet" href="css/crear-contrasena-funnel.css">
</head>
<body class="cuenta-funnel">

<div class="cuenta-page">
  <header class="cuenta-top">
    <a class="cuenta-logo" href="./">La <em>Tribu</em></a>
    <a class="cuenta-login" href="./camino?login=1">Iniciar sesión</a>
  </header>

  <div class="cuenta-onboarding">
    <h1>Crea tu nueva contraseña.</h1>
    <p class="cuenta-lead" id="rsLead">Elige una contraseña que no uses en otros sitios.</p>

    <form class="cuenta-form-card" id="rsForm" novalidate>
      <label for="pw1">Nueva contraseña</label>
      <input type="password" id="pw1" autocomplete="new-password" minlength="8" required placeholder="Al menos 8 caracteres">

      <label for="pw2">Confirmar contraseña</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="8" required placeholder="Repite tu contraseña">

      <label class="cuenta-check">
        <input type="checkbox" id="pwShow">
        <span>Mostrar contraseña</span>
      </label>

      <p id="pwErr" class="cuenta-error" role="alert"></p>

      <button type="submit" class="funnel-btn" id="pwSave">Guardar contraseña</button>
    </form>

    <div id="rsOk" style="display:none">
      <p class="cuenta-lead" id="rsOkMsg">Tu contraseña se actualizó.</p>
      <a class="funnel-btn" href="./camino?login=1">Iniciar sesión</a>
    </div>

    <p class="cuenta-foot">El enlace vence a los 60 minutos y solo puede usarse una vez.</p>
  </div>
</div>

<script src="js/funnel-utils.js"></script>
<script src="js/restablecer-contrasena.js"></script>
</body>
</html>
