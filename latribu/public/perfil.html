<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Perfil — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <link rel="stylesheet" href="vendor/quill.snow.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-ui,'Inter',sans-serif); color: var(--txt); background: var(--bg); min-height: 100vh; line-height: 1.45; }
    a { text-decoration: none; }

    /* NAV */
    .site-nav { position: fixed; top: 0; width: 100%; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .site-nav .tribu-brand { font-family: 'Fraunces',serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; color: var(--tribu-600,#A84F3E); text-decoration: none; }
    .site-nav-end { display: flex; align-items: center; gap: 10px; margin-left: auto; }

    /* USER MENU */
    .user-menu { position: relative; z-index: 120; }
    .user-menu-btn { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--tribu-100,#F7ECE9); cursor: pointer; color: var(--txt); font-family: inherit; transition: border-color .2s, background .2s; }
    .user-menu-btn:hover, .user-menu.open .user-menu-btn { border-color: rgba(168,79,62,.55); background: var(--surface-raised,#F0E0DA); }
    .user-menu-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(168,79,62,.35); }
    .user-menu-avatar-ph { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: rgba(168,79,62,.28); color: #fff; font-size: .82rem; font-weight: 800; }
    .user-menu-label { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    .user-menu-name { font-size: .88rem; font-weight: 800; color: var(--txt); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-menu-sub { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .user-menu-chevron { margin-left: 2px; color: var(--muted); font-size: .75rem; transition: transform .2s; }
    .user-menu.open .user-menu-chevron { transform: rotate(180deg); }
    .user-menu-panel { display: none; position: absolute; top: calc(100% + 10px); right: 0; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 16px 48px rgba(14,23,20,.14); }
    .user-menu.open .user-menu-panel { display: block; animation: menuIn .18s ease; }
    @keyframes menuIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
    .user-menu-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .user-menu-head-name { font-weight: 800; color: var(--txt); font-size: .92rem; }
    .user-menu-head-email { font-size: .78rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .user-menu-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: none; background: none; color: var(--txt); font-family: inherit; font-weight: 700; font-size: .9rem; border-radius: 10px; cursor: pointer; text-align: left; transition: background .15s; text-decoration: none; }
    .user-menu-item:hover, .user-menu-item:focus-visible { background: var(--tribu-100,#F7ECE9); outline: none; }
    .user-menu-item.active { color: var(--tribu-700,#8F4234); background: var(--tribu-100,#F7ECE9); }
    .user-menu-item .mi { width: 1.35rem; text-align: center; flex-shrink: 0; }
    .user-menu-item.danger { color: var(--danger,#B64A5A); }
    .user-menu-item.danger:hover { background: var(--danger-bg,#FCECEF); }
    .user-menu-divider { height: 1px; background: var(--line); margin: 6px 4px; }
    .nav-login-link { color: var(--muted); font-size: .9rem; font-weight: 700; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }

    /* LAYOUT */
    .account-shell { padding-top: 80px; min-height: 100vh; background: linear-gradient(180deg, var(--tribu-100,#F7ECE9) 0%, var(--bg) 240px); }
    .account-inner { max-width: 760px; margin: 0 auto; padding: 32px 22px 64px; }
    .account-header { margin-bottom: 28px; }
    .account-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: none; color: var(--muted); font-family: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; padding: 0; text-decoration: none; }
    .account-back:hover { color: var(--txt); }
    .account-eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--muted); margin: 0 0 6px; }
    .account-title { font-family: 'Fraunces',serif; font-size: 1.75rem; font-weight: 700; color: var(--txt); margin: 0; }
    .account-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 22px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
    .account-tab { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; text-decoration: none; display: inline-block; }
    .account-tab:hover { background: var(--tribu-100,#F7ECE9); color: var(--txt); }
    .account-tab.active { background: var(--tribu-600,#A84F3E); border-color: transparent; color: #fff; box-shadow: 0 8px 22px -10px rgba(168,79,62,.55); }

    /* LOADER */
    .page-loader { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(14,23,20,.38); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .page-loader.show { display: flex; }
    .page-loader-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 36px; text-align: center; box-shadow: 0 12px 40px rgba(14,23,20,.12); min-width: 180px; }
    .page-loader-spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(168,79,62,.2); border-top-color: #A84F3E; animation: spin .75s linear infinite; margin: 0 auto 12px; }
    .page-loader-text { font-size: .88rem; font-weight: 700; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PROFILE */
    .profile-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
    .profile-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }

    /* Avatar LinkedIn-style */
    .avatar-upload { position: relative; width: 100px; height: 100px; flex-shrink: 0; cursor: pointer; }
    .avatar-upload input[type=file] { display: none; }
    .avatar-circle { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(168,79,62,.45); background: rgba(168,79,62,.15); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; color: #fff; overflow: hidden; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .avatar-overlay { position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .avatar-upload:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay-icon { font-size: 1.4rem; line-height: 1; }
    .avatar-overlay-text { font-size: .62rem; font-weight: 800; color: #fff; letter-spacing: .04em; text-transform: uppercase; }
    .avatar-remove { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fb7185; border: 2px solid #fff; color: #fff; font-size: .75rem; line-height: 1; display: none; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; z-index: 2; }
    .avatar-remove.show { display: flex; }

    .profile-field { margin-bottom: 14px; }
    .profile-field label { display: block; font-size: .82rem; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
    .profile-field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface,var(--panel)); color: var(--txt); font-family: inherit; font-size: .95rem; }
    .profile-field input:focus { outline: none; border-color: rgba(168,79,62,.55); box-shadow: 0 0 0 3px rgba(168,79,62,.12); }
    .profile-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .profile-btn { padding: 11px 20px; border-radius: 30px; border: none; font-weight: 800; font-family: inherit; cursor: pointer; font-size: .9rem; transition: opacity .2s, transform .15s; }
    .profile-btn:hover { opacity: .9; transform: translateY(-1px); }
    .profile-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .profile-btn-primary { background: linear-gradient(135deg,#A84F3E,#8F4234); color: #fff; }
    .profile-btn-outline { background: transparent; border: 1px solid rgba(168,79,62,.45); color: var(--tribu-700,#8F4234); }
    .profile-msg { margin-top: 12px; font-size: .88rem; font-weight: 700; min-height: 20px; }
    .profile-msg.ok { color: #2dd4bf; }
    .profile-msg.err { color: #fb7185; }
    .tribu-form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* QUILL / EMOJI */
    .ql-toolbar.ql-snow { border-radius: 10px 10px 0 0; border-color: var(--line); background: var(--tribu-100,#F7ECE9); }
    .ql-container.ql-snow { border-radius: 0 0 10px 10px; border-color: var(--line); min-height: 120px; font-family: inherit; font-size: .95rem; }
    .ql-editor { min-height: 110px; color: var(--txt); }
    .ql-editor.ql-blank::before { color: var(--muted); font-style: normal; }
    .emoji-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 1.1rem; color: var(--muted); transition: background .15s; }
    .emoji-btn:hover { background: var(--tribu-100,#F7ECE9); }
    .emoji-picker-wrap { position: relative; display: inline-block; }
    .emoji-grid { display: none; position: absolute; z-index: 200; top: calc(100% + 6px); left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 12px 36px rgba(14,23,20,.12); flex-wrap: wrap; gap: 4px; width: 260px; max-height: 200px; overflow-y: auto; }
    .emoji-grid.open { display: flex; }
    .emoji-grid button { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px; border-radius: 6px; transition: background .1s; }
    .emoji-grid button:hover { background: var(--tribu-100,#F7ECE9); }

    /* MODALS */
    .auth-overlay { display: none; position: fixed; inset: 0; background: rgba(12,18,16,.48); backdrop-filter: blur(6px); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
    .auth-overlay.show { display: flex; }
    .auth-box { background: var(--panel); border: 1px solid rgba(168,79,62,.35); border-radius: 24px; width: 100%; max-width: 440px; padding: 36px 32px 28px; position: relative; box-shadow: 0 40px 90px -30px rgba(168,79,62,.45); }
    .tribu-feedback-box { max-width: 440px; text-align: center; padding-top: 32px; }
    .tribu-feedback-icon { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .tribu-feedback-icon.success { background: linear-gradient(135deg,rgba(45,212,191,.22),rgba(56,189,248,.18)); border: 1px solid rgba(45,212,191,.45); color: #5eead4; }
    .tribu-feedback-icon.error { background: linear-gradient(135deg,rgba(251,113,133,.18),rgba(168,79,62,.12)); border: 1px solid rgba(251,113,133,.42); color: #fb7185; }
    .tribu-feedback-icon.warn { background: linear-gradient(135deg,rgba(251,191,36,.18),rgba(168,79,62,.1)); border: 1px solid rgba(251,191,36,.4); color: #fcd34d; }
    .tribu-feedback-icon.processing { background: linear-gradient(135deg,rgba(168,79,62,.18),rgba(168,79,62,.12)); border: 1px solid rgba(168,79,62,.38); color: transparent; }
    .tribu-feedback-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(168,79,62,.22); border-top-color: #A84F3E; animation: tribuSpin .8s linear infinite; }
    @keyframes tribuSpin { to { transform: rotate(360deg); } }
    .tribu-feedback-eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .tribu-feedback-msg { color: var(--muted); font-size: .95rem; line-height: 1.55; margin: 10px 0 22px; }
    .auth-btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#A84F3E,#8F4234); border: none; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 800; font-family: inherit; cursor: pointer; }
    .tribu-confirm-box { max-width: 440px; text-align: center; padding: 28px 26px 24px; }
    .tribu-confirm-actions { display: flex; gap: 10px; margin-top: 6px; }
    .tribu-confirm-btn { flex: 1; padding: 12px 14px; border-radius: 999px; font-weight: 800; font-family: inherit; font-size: .88rem; cursor: pointer; }
    .tribu-confirm-btn.outline { background: transparent; border: 1px solid rgba(168,79,62,.45); color: var(--tribu-700,#8F4234); }
    .tribu-confirm-btn.danger { border: none; color: #fff; background: linear-gradient(135deg,#be123c,#9f1239); }
    .tribu-confirm-btn.primary { border: none; color: #fff; background: linear-gradient(135deg,#A84F3E,#8F4234); }

    footer { margin-top: 0; background: #fff; color: var(--muted); text-align: center; padding: 32px 20px; font-size: .9rem; font-weight: 600; border-top: 1px solid var(--line); position: relative; }
    footer::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 3px; background: linear-gradient(135deg,#A84F3E,#8F4234); }

    @media (max-width: 600px) {
      .account-inner { padding: 24px 16px 48px; }
      .tribu-form-grid-2 { grid-template-columns: 1fr; gap: 0; }
      .profile-head { flex-direction: column; align-items: flex-start; }
      .profile-actions { flex-direction: column; }
      .profile-actions .profile-btn { width: 100%; justify-content: center; min-height: 44px; }
      .account-tabs { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
      .account-tabs::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="__app_base__/" class="tribu-brand">La Tribu</a>
  <div class="site-nav-end" id="navAuthArea"></div>
</nav>

<div class="account-shell">
  <div class="account-inner">
    <header class="account-header">
      <a href="__app_base__/" class="account-back">← Volver a La Tribu</a>
      <p class="account-eyebrow">Mi cuenta</p>
      <h1 class="account-title">Mi perfil</h1>
    </header>
    <nav class="account-tabs">
      <a href="__app_base__/perfil" class="account-tab active">Mi perfil</a>
      <a href="__app_base__/suscripciones" class="account-tab">Suscripciones</a>
      <a href="__app_base__/tarjetas" class="account-tab">Mis tarjetas</a>
    </nav>

    <div class="profile-card">
      <div class="profile-head">
        <label class="avatar-upload" id="avatarUploadLabel" title="Cambiar foto">
          <input type="file" id="pfFoto" accept="image/jpeg,image/png,image/webp,image/gif" onchange="onFotoSelected()">
          <div class="avatar-circle" id="avatarCircle"></div>
          <div class="avatar-overlay">
            <span class="avatar-overlay-icon">📷</span>
            <span class="avatar-overlay-text">Cambiar</span>
          </div>
          <button type="button" class="avatar-remove" id="avatarRemoveBtn" onclick="event.preventDefault();event.stopPropagation();quitarFotoPerfil()" title="Quitar foto">✕</button>
        </label>
        <div>
          <div style="font-family:'Fraunces',serif;font-size:1.35rem;color:var(--txt)" id="profileHeading">Tu perfil</div>
          <div style="color:var(--muted);font-size:.88rem;margin-top:4px">Cuéntanos sobre ti</div>
        </div>
      </div>
      <div class="tribu-form-grid-2">
        <div class="profile-field"><label>Nombre</label><input type="text" id="pfNombre" autocomplete="given-name"></div>
        <div class="profile-field"><label>Apellido</label><input type="text" id="pfApellido" autocomplete="family-name"></div>
      </div>
      <div class="profile-field"><label>Correo</label><input type="email" id="pfEmail" autocomplete="email"></div>
      <div class="profile-field"><label>Celular</label><input type="tel" id="pfTelefono" autocomplete="tel"></div>
      <div class="profile-field"><label>Carrera / Profesión</label><input type="text" id="pfCarrera" placeholder="Ej: Psicóloga, Ingeniera, Coach..." maxlength="200"></div>
      <div class="profile-field">
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span>Mis hobbies</span>
          <span class="emoji-picker-wrap">
            <button type="button" class="emoji-btn" onclick="toggleEmojiPicker('hobbiesEmoji',event)" title="Insertar emoji">😊</button>
            <div class="emoji-grid" id="hobbiesEmoji"></div>
          </span>
        </label>
        <div id="pfHobbiesEditor"></div>
      </div>
      <div class="profile-field">
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span>¿A qué te dedicas?</span>
          <span class="emoji-picker-wrap">
            <button type="button" class="emoji-btn" onclick="toggleEmojiPicker('dedicasEmoji',event)" title="Insertar emoji">😊</button>
            <div class="emoji-grid" id="dedicasEmoji"></div>
          </span>
        </label>
        <div id="pfDedicasEditor"></div>
      </div>
      <div class="profile-actions">
        <button type="button" class="profile-btn profile-btn-primary" id="pfSaveBtn" onclick="guardarPerfil()">Guardar</button>
      </div>
      <div class="profile-msg" id="pfMsg"></div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; <script>document.write(new Date().getFullYear())</script> VHM - Bienestar, Relaciones &amp; Superación Personal.</p>
</footer>

<!-- Loader -->
<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando...</div>
  </div>
</div>

<!-- Modal feedback -->
<div class="auth-overlay" id="tribuFeedbackOverlay" role="dialog" aria-modal="true" aria-labelledby="tribuFeedbackTitle">
  <div class="auth-box tribu-feedback-box">
    <div class="tribu-feedback-icon success" id="tribuFeedbackIcon">✓</div>
    <div class="tribu-feedback-eyebrow">La Tribu</div>
    <div class="auth-title" id="tribuFeedbackTitle" style="text-align:center;font-size:1.15rem;font-weight:800;color:var(--txt);margin-bottom:4px"></div>
    <p class="tribu-feedback-msg" id="tribuFeedbackMsg"></p>
    <button type="button" class="auth-btn" id="tribuFeedbackBtn" onclick="cerrarTribuFeedback()">Continuar</button>
  </div>
</div>

<!-- Modal confirm -->
<div class="auth-overlay" id="tribuConfirmOverlay" role="dialog" aria-modal="true">
  <div class="auth-box tribu-confirm-box">
    <div class="tribu-feedback-icon warn" id="tribuConfirmIcon">?</div>
    <div class="tribu-feedback-eyebrow">La Tribu</div>
    <div class="auth-title" id="tribuConfirmTitle" style="text-align:center;font-size:1.15rem;font-weight:800;color:var(--txt);margin-bottom:4px"></div>
    <p class="tribu-feedback-msg" id="tribuConfirmMsg"></p>
    <div class="tribu-confirm-actions">
      <button type="button" class="tribu-confirm-btn outline" id="tribuConfirmCancel">Volver</button>
      <button type="button" class="tribu-confirm-btn danger" id="tribuConfirmOk">Confirmar</button>
    </div>
  </div>
</div>

<script src="vendor/quill.min.js"></script>
<script src="js/tribu-common.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
