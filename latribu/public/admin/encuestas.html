<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuestas - Tribu Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>📊 Encuestas</h2>
        <p>Crea encuestas con opción única, múltiple o texto libre y comparte el enlace</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nueva">+ Nueva encuesta</button>
    </div>
    <div id="enc-list" class="enc-list">
      <div class="table-empty"><div class="empty-icon">📊</div><div class="empty-text">Cargando…</div></div>
    </div>

    <div class="modal-overlay" id="modal-encuesta">
      <div class="modal lg">
        <div class="modal-header">
          <h3 id="modal-enc-title">📊 Nueva encuesta</h3>
          <button type="button" class="modal-close" data-modal-close="modal-encuesta">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-section">
            <div class="form-section-title"><span class="step">1</span>Datos generales</div>
            <div class="form-group">
              <label for="enc-titulo">Título</label>
              <input type="text" id="enc-titulo" placeholder="Ej. Satisfacción del evento">
            </div>
            <div class="form-group">
              <label for="enc-desc">Descripción <span class="optional">(opcional)</span></label>
              <textarea id="enc-desc" rows="2" placeholder="Texto introductorio para quien responde"></textarea>
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-title"><span class="step">2</span>Publicación</div>
            <div class="form-row form-grid">
              <div class="form-group" id="enc-link-group" style="display:none">
                <label for="enc-link-preview">Enlace para compartir</label>
                <div class="link-box">
                  <input type="text" id="enc-link-preview" readonly>
                  <button type="button" class="btn btn-outline btn-xs" id="btn-copy-link">Copiar</button>
                </div>
              </div>
              <div class="form-group">
                <label for="enc-activa">Estado</label>
                <select id="enc-activa">
                  <option value="1">🟢 Activa</option>
                  <option value="0">🔴 Inactiva</option>
                </select>
              </div>
            </div>
            <p id="enc-link-hint" class="enc-link-hint">Al guardar se generará un enlace único de 10 caracteres.</p>
          </div>
          <div class="form-section">
            <div class="form-section-title"><span class="step">3</span>Preguntas</div>
            <div id="preguntas-editor"></div>
            <button type="button" class="btn btn-outline btn-sm" id="btn-add-pregunta" style="margin-top:4px">+ Agregar pregunta</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close="modal-encuesta">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar-enc">💾 Guardar</button>
        </div>
      </div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/encuestas.js"></script>
</body>
</html>
