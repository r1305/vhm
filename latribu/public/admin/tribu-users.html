<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios Tribu - Tribu Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>🫂 Usuarios de La Tribu</h2>
        <p>Pacientes importados con acceso a La Tribu</p>
      </div>
    </div>
    <div class="filter-row">
      <input type="text" id="inp-busqueda" placeholder="Buscar por nombre, correo o celular…" aria-label="Buscar usuarios" style="flex:1">
      <div class="toolbar-end">
        <label for="sel-per-page">Ver por página</label>
        <select id="sel-per-page">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div id="tribu-body"></div>
      </div>
      <div id="pg-wrap" style="display:none">
        <div class="card-footer">
          <div id="pg-total" class="pager-total"></div>
          <div id="pg-buttons" class="pager"></div>
        </div>
      </div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/tribu-users.js"></script>
</body>
</html>
