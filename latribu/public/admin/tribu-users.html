<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios Tribu - Tribu Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>🫂 Usuarios de La Tribu</h2>
        <p>Pacientes importados con acceso a La Tribu</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="filter-row" style="margin-bottom:16px">
          <input type="text" id="inp-busqueda" placeholder="Buscar por nombre, correo o celular…" style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
            <span style="font-size:.85rem;color:var(--text-muted)">Ver por página</span>
            <select id="sel-per-page">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
        <div id="tribu-body"></div>
        <div id="pg-wrap" style="display:none">
          <div id="pg-buttons" style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap"></div>
          <div id="pg-total" style="text-align:center;font-size:.8rem;color:#9ca3af;margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script><script src="js/tribu-users.js"></script>
</body>
</html>
