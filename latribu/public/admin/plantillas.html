<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantillas - Tribu Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/plantillas.css">
  <script src="js/base.js"></script>
</head>
<body>
  <div id="admin-root"><div id="page-main" style="display:none">
    <div class="section-header">
      <div>
        <h2>📝 Plantillas</h2>
        <p>Eventos y mensajes con formato WhatsApp para copiar y enviar</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nuevo-evento">+ Nuevo evento</button>
    </div>
    <div id="plantillas-list" class="plantillas-list"></div>

    <div class="modal-overlay" id="modal-evento">
      <div class="modal" style="max-width:420px">
        <div class="modal-header">
          <h3 id="modal-evento-title">📅 Nuevo evento</h3>
          <button type="button" class="modal-close" data-modal-close="modal-evento">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="ev-nombre">Nombre *</label>
            <input type="text" id="ev-nombre" placeholder="Ej: Taller de mindfulness">
          </div>
          <div class="form-group">
            <label for="ev-fecha">Fecha *</label>
            <input type="date" id="ev-fecha">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close="modal-evento">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar-evento">Guardar</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modal-mensaje">
      <div class="modal modal-mensaje">
        <div class="modal-header">
          <h3 id="modal-mensaje-title">💬 Nuevo mensaje</h3>
          <button type="button" class="modal-close" data-modal-close="modal-mensaje">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="msg-titulo">Título *</label>
            <input type="text" id="msg-titulo" placeholder="Ej: Recordatorio 24h">
          </div>
          <div class="form-group">
            <label>Mensaje * <span class="optional">(formato WhatsApp)</span></label>
            <div id="wa-editor-root"></div>
          </div>
          <div class="form-group">
            <label>Foto <span class="optional">(opcional)</span></label>
            <div id="msg-foto-preview" style="display:none;margin-bottom:8px">
              <img id="msg-foto-img" src="" alt="preview" style="max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--border)">
              <button type="button" id="btn-quitar-foto" style="display:block;margin-top:6px;font-size:12px;color:var(--danger);background:none;border:none;cursor:pointer">✕ Quitar foto</button>
            </div>
            <input type="file" id="msg-foto-input" accept="image/*" style="display:none">
            <button type="button" class="btn btn-outline btn-sm" id="btn-seleccionar-foto">🖼️ Seleccionar foto</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close="modal-mensaje">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar-mensaje">Guardar</button>
        </div>
      </div>
    </div>
  </div></div>
  <!-- Modal subir foto a mensaje existente -->
  <div class="modal-overlay" id="modal-foto">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h3>🖼️ Foto del mensaje</h3>
        <button type="button" class="modal-close" data-modal-close="modal-foto">✕</button>
      </div>
      <div class="modal-body">
        <div id="foto-modal-preview" style="margin-bottom:12px"></div>
        <input type="file" id="foto-modal-input" accept="image/*" style="display:none">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn btn-outline btn-sm" id="btn-foto-modal-seleccionar">🖼️ Seleccionar imagen</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-foto-modal-eliminar" style="display:none">✕ Eliminar foto</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px">Máx. 8 MB · JPG, PNG, WEBP, GIF</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close="modal-foto">Cerrar</button>
        <button type="button" class="btn btn-primary" id="btn-foto-modal-guardar" style="display:none">Subir foto</button>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/wa-editor.js"></script>
  <script src="js/plantillas.js"></script>
</body>
</html>
