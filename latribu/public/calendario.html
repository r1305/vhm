<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-ui,'Inter',sans-serif); color: var(--txt); background: var(--bg); min-height: 100vh; line-height: 1.45; }
    a { text-decoration: none; }

    .site-nav { position: fixed; top: 0; width: 100%; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .site-nav .tribu-brand { font-family: 'Fraunces',serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; color: var(--tribu-600,#A84F3E); text-decoration: none; }
    .site-nav-end { display: flex; align-items: center; gap: 10px; margin-left: auto; }

    .user-menu { position: relative; z-index: 120; }
    .user-menu-btn { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--tribu-100,#F7ECE9); cursor: pointer; color: var(--txt); font-family: inherit; transition: border-color .2s, background .2s; }
    .user-menu-btn:hover, .user-menu.open .user-menu-btn { border-color: rgba(168,79,62,.55); background: var(--surface-raised,#F0E0DA); }
    .user-menu-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(168,79,62,.35); }
    .user-menu-avatar-ph { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: rgba(168,79,62,.28); color: #fff; font-size: .82rem; font-weight: 800; }
    .user-menu-label { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    .user-menu-name { font-size: .88rem; font-weight: 800; color: var(--txt); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-menu-sub { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .user-menu-chevron { margin-left: 2px; color: var(--muted); font-size: .75rem; transition: transform .2s; }
    .user-menu.open .user-menu-chevron { transform: rotate(180deg); }
    .user-menu-panel { display: none; position: absolute; top: calc(100% + 10px); right: 0; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 16px 48px rgba(14,23,20,.14); }
    .user-menu.open .user-menu-panel { display: block; animation: menuIn .18s ease; }
    @keyframes menuIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
    .user-menu-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .user-menu-head-name { font-weight: 800; color: var(--txt); font-size: .92rem; }
    .user-menu-head-email { font-size: .78rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .user-menu-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: none; background: none; color: var(--txt); font-family: inherit; font-weight: 700; font-size: .9rem; border-radius: 10px; cursor: pointer; text-align: left; transition: background .15s; text-decoration: none; }
    .user-menu-item:hover { background: var(--tribu-100,#F7ECE9); }
    .user-menu-item .mi { width: 1.35rem; text-align: center; flex-shrink: 0; }
    .user-menu-item.danger { color: var(--danger,#B64A5A); }
    .user-menu-item.danger:hover { background: var(--danger-bg,#FCECEF); }
    .user-menu-divider { height: 1px; background: var(--line); margin: 6px 4px; }
    .nav-login-link { color: var(--muted); font-size: .9rem; font-weight: 700; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }

    .page-shell { padding-top: 80px; min-height: 100vh; }
    .page-inner { max-width: 960px; margin: 0 auto; padding: 32px 22px 64px; }
    .page-header { margin-bottom: 28px; }
    .account-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: none; color: var(--muted); font-family: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; padding: 0; text-decoration: none; }
    .account-back:hover { color: var(--txt); }
    .page-title { font-family: 'Fraunces',serif; font-size: 1.75rem; font-weight: 700; color: var(--txt); margin: 0; }

    .lock-banner { margin: 0 0 32px; padding: 28px 24px; background: rgba(168,79,62,.08); border: 1px solid rgba(168,79,62,.35); border-radius: 18px; text-align: center; }
    .lock-banner .lock-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .lock-banner h3 { font-family: 'Fraunces',serif; font-size: 1.3rem; color: var(--txt); margin-bottom: 8px; }
    .lock-banner p { color: var(--muted); font-size: .92rem; line-height: 1.6; margin-bottom: 18px; }
    .lock-banner .lock-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .lock-btn { padding: 11px 24px; border-radius: 30px; font-size: .9rem; font-weight: 800; font-family: inherit; cursor: pointer; border: none; transition: transform .15s, opacity .2s; }
    .lock-btn:hover { transform: translateY(-2px); opacity: .9; }
    .lock-btn-primary { background: linear-gradient(135deg,#A84F3E,#8F4234); color: #fff; }

    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
    .cal-header h2 { font-family: 'Fraunces',serif; font-size: 1.6rem; color: var(--txt); text-transform: capitalize; }
    .cal-nav { display: flex; gap: 8px; }
    .cal-nav-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--txt); font-family: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; transition: background .15s, border-color .15s; }
    .cal-nav-btn:hover { background: var(--tribu-100,#F7ECE9); border-color: rgba(168,79,62,.35); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-dow { text-align: center; font-size: .75rem; font-weight: 800; color: var(--muted); padding: 8px 4px; text-transform: uppercase; letter-spacing: .5px; }
    .cal-day { min-height: 88px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .cal-day.other { opacity: .35; pointer-events: none; }
    .cal-day.today { border-color: rgba(168,79,62,.55); box-shadow: 0 0 0 1px rgba(168,79,62,.25); }
    .cal-day-num { font-size: .82rem; font-weight: 800; color: var(--txt); }
    .cal-ev { font-size: .68rem; font-weight: 700; padding: 4px 6px; border-radius: 6px; background: rgba(168,79,62,.2); color: #8F4234; line-height: 1.2; cursor: pointer; }
    .cal-ev:hover { background: rgba(168,79,62,.35); }
    .cal-icon { position: relative; display: inline-block; width: 24px; height: 24px; }
    .cal-icon-inner { font-size: 1.2rem; line-height: 1; }
    .cal-badge { position: absolute; top: -4px; right: -4px; background: #c8e6f0; color: #000; border-radius: 50%; padding: 2px 4px; font-size: .6rem; line-height: 1; }
    .cal-events-desktop { display: block; }
    .cal-events-mobile { display: none; }
    .cal-empty { text-align: center; color: var(--muted); padding: 40px 20px; }

    .evt-overlay { display: none; position: fixed; inset: 0; background: rgba(12,18,16,.48); backdrop-filter: blur(6px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
    .evt-overlay.show { display: flex; }
    .evt-box { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; width: 100%; max-width: 480px; padding: 28px 28px 24px; position: relative; box-shadow: 0 40px 90px -30px rgba(168,79,62,.4); }
    .evt-box h2 { font-family: 'Fraunces',serif; font-size: 1.45rem; color: var(--txt); margin-bottom: 18px; padding-right: 36px; line-height: 1.25; }
    .evt-row { display: flex; gap: 10px; margin-bottom: 12px; font-size: .92rem; color: var(--muted); line-height: 1.5; }
    .evt-row .evt-icon { flex: none; width: 22px; text-align: center; }
    .evt-row .evt-val { color: var(--txt); }
    .evt-link { color: #A84F3E; font-weight: 700; word-break: break-all; text-decoration: underline; text-underline-offset: 3px; }
    .evt-close { position: absolute; top: 16px; right: 18px; background: #F7ECE9; color: var(--txt); border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .evt-close:hover { background: #F0E0DA; color: #8F4234; border-color: rgba(168,79,62,.45); }

    .page-loader { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(14,23,20,.38); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .page-loader.show { display: flex; }
    .page-loader-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 36px; text-align: center; min-width: 180px; }
    .page-loader-spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(168,79,62,.2); border-top-color: #A84F3E; animation: spin .75s linear infinite; margin: 0 auto 12px; }
    .page-loader-text { font-size: .88rem; font-weight: 700; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: #fff; color: var(--muted); text-align: center; padding: 32px 20px; font-size: .9rem; font-weight: 600; border-top: 1px solid var(--line); position: relative; }
    footer::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 3px; background: linear-gradient(135deg,#A84F3E,#8F4234); }

    @media (max-width: 768px) {
      .page-inner { padding: 24px 10px 48px; }
      .cal-header h2 { font-size: 1.25rem; }
      .cal-grid { gap: 4px; }
      .cal-dow { font-size: .62rem; padding: 6px 2px; letter-spacing: 0; }
      .cal-day { min-height: 54px; padding: 5px 3px; border-radius: 10px; }
      .cal-day-num { font-size: .72rem; }
      .cal-events-desktop { display: none; }
      .cal-events-mobile { display: block; }
      .evt-overlay { padding: 12px; }
      .evt-box { padding: 22px 18px 18px; border-radius: 16px; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="/" class="tribu-brand">La Tribu</a>
  <div class="site-nav-end" id="navAuthArea"></div>
</nav>

<div class="page-shell">
  <div class="page-inner">
    <header class="page-header">
      <a href="/" class="account-back">← Volver a La Tribu</a>
      <h1 class="page-title">📅 Calendario</h1>
    </header>
    <div id="calLockBanner" style="display:none"></div>
    <div id="calContenido">
      <div class="cal-header">
        <h2 id="calMesTitulo"></h2>
        <div class="cal-nav">
          <button type="button" class="cal-nav-btn" onclick="cambiarMes(-1)">‹ Anterior</button>
          <button type="button" class="cal-nav-btn" onclick="cambiarMes(1)">Siguiente ›</button>
        </div>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:8px"></div>
      <div class="cal-empty" id="calLoading">Cargando eventos...</div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; <script>document.write(new Date().getFullYear())</script> VHM - Bienestar, Relaciones &amp; Superación Personal.</p>
</footer>

<!-- Modal evento -->
<div class="evt-overlay" id="evtOverlay">
  <div class="evt-box">
    <button type="button" class="evt-close" onclick="cerrarEvento()" aria-label="Cerrar">&times;</button>
    <h2 id="evtNombre"></h2>
    <div class="evt-row"><span class="evt-icon">📅</span><span class="evt-val" id="evtFecha"></span></div>
    <div class="evt-row"><span class="evt-icon">🕐</span><span class="evt-val" id="evtHora"></span></div>
    <div class="evt-row"><span class="evt-icon">📍</span><span class="evt-val" id="evtLugar"></span></div>
    <div class="evt-row" id="evtLinkRow"><span class="evt-icon">🔗</span><span class="evt-val"><a id="evtLink" class="evt-link" href="#" target="_blank" rel="noopener noreferrer">Abrir link</a></span></div>
  </div>
</div>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando...</div>
  </div>
</div>

<script src="js/tribu-common.js"></script>
<script src="js/calendario.js"></script>
</body>
</html>
