<!DOCTYPE html>
<html lang="es" data-product="tribu">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('tribu-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vhm-design-tokens-v1.css">
  <link rel="stylesheet" href="css/latribu-public-theme.css">
  <link rel="stylesheet" href="css/member-app.css">
  <link rel="stylesheet" href="css/member-inicio.css">
  <link rel="stylesheet" href="css/member-pages.css">
</head>
<body class="member-start member-page calendar">

<div class="page-shell member-page-shell wide calendar no-trial" data-member-main>
  <div class="member-start-trial" id="memberTrialStrip" hidden></div>
  <header class="member-page-hero">
    <p class="member-page-eyebrow">Calendario</p>
    <h1>Lo próximo en La Tribu.</h1>
    <p class="member-page-lead">Encuentra tu próximo espacio. Todos los horarios se muestran en Lima (GMT−5).</p>
  </header>

  <div id="calLockBanner" style="display:none"></div>

  <p class="cal-info-line" id="calInfoLine" hidden></p>

  <div class="cal-week-controls">
    <button type="button" id="calWeekPrev">Semana anterior</button>
    <strong id="calWeekLabel" aria-live="polite">Próximos 7 días</strong>
    <button type="button" id="calWeekNext">Semana siguiente</button>
  </div>

  <div class="cal-type-chips chips" id="calTypeFilters" role="tablist" aria-label="Tipo de encuentro"></div>
  <div id="calWeekList" class="cal-agenda agenda" aria-live="polite"></div>

  <div class="cal-month-toggle">
    <button type="button" id="calToggleMonth" aria-expanded="false">Ver calendario mensual</button>
  </div>
  <div class="member-surface calendar cal-month-panel" id="calContenido" hidden>
    <div class="cal-header">
      <h2 id="calMesTitulo"></h2>
      <div class="cal-nav">
        <button type="button" class="cal-nav-btn" onclick="cambiarMes(-1)">‹ Anterior</button>
        <button type="button" class="cal-nav-btn" onclick="cambiarMes(1)">Siguiente ›</button>
      </div>
    </div>
    <div class="cal-grid" id="calDow"></div>
    <div class="cal-grid" id="calGrid" style="margin-top:8px"></div>
    <div class="cal-empty" id="calLoading">Cargando eventos…</div>
  </div>

</div>

<div class="calendar">
  <div class="evt-overlay" id="evtOverlay">
    <div class="evt-box">
      <button type="button" class="evt-close" onclick="cerrarEvento()" aria-label="Cerrar">&times;</button>
      <h2 id="evtNombre"></h2>
      <div class="evt-row"><span class="evt-icon">📅</span><span class="evt-val" id="evtFecha"></span></div>
      <div class="evt-row"><span class="evt-icon">🕐</span><span class="evt-val" id="evtHora"></span></div>
      <div class="evt-row"><span class="evt-icon">📍</span><span class="evt-val" id="evtLugar"></span></div>
      <div class="evt-row" id="evtLinkRow"><span class="evt-icon">🔗</span><span class="evt-val"><a id="evtLink" class="evt-link" href="#" target="_blank" rel="noopener noreferrer">Abrir link</a></span></div>
      <p class="evt-reserve-msg" id="evtReserveMsg" hidden></p>
      <div class="evt-actions" id="evtActions">
        <button type="button" class="member-start-btn-primary" id="evtReserveBtn">Reservar mi lugar</button>
        <button type="button" class="member-start-btn-ghost" id="evtIcsBtn">Añadir a mi calendario</button>
        <button type="button" class="evt-cancel-reserve" id="evtCancelBtn" hidden>Cancelar mi reserva</button>
      </div>
    </div>
  </div>
</div>

<div class="page-loader" id="pageLoader">
  <div class="page-loader-box">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text" id="pageLoaderText">Cargando…</div>
  </div>
</div>

<script src="js/tribu-common.js"></script>
<script src="js/tribu-contenido.js"></script>
<script src="js/funnel-utils.js"></script>
<script src="js/member-app.js"></script>
<script src="js/calendario.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await MemberApp.init({ requireSub: true, layout: 'funnel' });
  if (ok && typeof window.initCalendarioMiembro === 'function') window.initCalendarioMiembro();
});
</script>
</body>
</html>
